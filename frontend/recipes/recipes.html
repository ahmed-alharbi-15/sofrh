<script>
    (function(){
        var u=JSON.parse(localStorage.getItem('safraUser')||'null');
        var av=localStorage.getItem('safraAvatar')||'';
        document.documentElement.className+=u?' user-logged-in':' user-logged-out';
        if(u){
            var t=setInterval(function(){
                var n=document.getElementById('userName');
                var a=document.getElementById('userAvatar');
                if(n){
                    n.textContent=u.name||'';
                    if(a&&(u.avatar||av)) a.src=u.avatar||av;
                    clearInterval(t);
                }
            },1);
        }
    })();
    </script>
