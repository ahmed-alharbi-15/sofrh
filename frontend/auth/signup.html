    <meta charset="UTF-8">
<script>
    (function(){
        var u=JSON.parse(localStorage.getItem('safraUser')||'null');
        var av=localStorage.getItem('safraAvatar')||'';
        document.documentElement.className+=u?' user-logged-in':' user-logged-out';
        if(u){
            var t=setInterval(function(){
                var n=document.getElementById('userName');
                var a=document.getElementById('userAvatar');
                if(n){
                    n.textContent=u.name||'';
                    if(a&&(u.avatar||av)) a.src=u.avatar||av;
                    clearInterval(t);
                }
            },1);
        }
    })();
    </script>

    <div class="auth-page">
        <div class="auth-card">
            <a href="/index/index.html" class="auth-logo">
                <img src="https://res.cloudinary.com/dqe6mmkzz/image/upload/f_auto,q_auto/logo-img.PNG" alt="سفرة – Sofrah">
            </a>
            <h1>إنشاء حساب</h1>
            <p class="auth-sub">انضم إلى سفرة واستكشف العالم </p>

            <form class="auth-form" id="signupForm">
                <div class="input-group">
                    <label>اسم المستخدم (4 خانات على الأقل)</label>
                    <input type="text" id="username" placeholder="اسم الحساب" required>
                </div>
                <div class="input-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="email" placeholder="example@email.com" required>
                </div>
                <div class="input-group">
                    <label>رقم الجوال (اختياري)</label>
                    <input type="tel" id="phone" placeholder="05xxxxxxxx">
                </div>
                <div class="input-group password-group">
                    <label>كلمة المرور (تبدأ بحرف كبير ورقم)</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="••••••••" required>
                        <button type="button" class="toggle-password" onclick="this.previousElementSibling.type = this.previousElementSibling.type === 'password' ? 'text' : 'password'; this.textContent = this.previousElementSibling.type === 'password' ? '👁️' : '🙈'">👁️</button>
                    </div>
                </div>
                <div class="input-group password-group">
                    <label>تأكيد كلمة المرور</label>
                    <div class="password-wrapper">
                        <input type="password" id="confirmPassword" placeholder="••••••••" required>
                        <button type="button" class="toggle-password" onclick="this.previousElementSibling.type = this.previousElementSibling.type === 'password' ? 'text' : 'password'; this.textContent = this.previousElementSibling.type === 'password' ? '👁️' : '🙈'">👁️</button>
                    </div>
                </div>
                <button type="button" id="signupBtn" class="auth-btn">إنشاء الحساب</button>
            </form>

            <p class="auth-switch">عندك حساب؟ <a href="/auth/login.html">تسجيل الدخول</a></p>
        </div>
    </div>
    
    <!-- Cinematic Travel Loading Overlay -->
    <div id="loadingScreen" class="travel-loader-overlay" style="display:none;">
        <div class="travel-loader-wrapper">
            <div class="orbit-plane-track">

                    <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
                </svg>
            </div>
            <div class="loader-spinner-ring"></div>
            <div class="loader-logo-box">

            </div>
        </div>
