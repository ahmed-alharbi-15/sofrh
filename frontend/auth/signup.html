<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سفرة - إنشاء حساب</title>
    <link rel="stylesheet" href="/auth/auth.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@500;600&display=swap');
    </style>
</head>

<body>
    <div class="auth-page">
        <div class="auth-card">
            <a href="/index/index.html" class="auth-logo">
                <img src="/img/logo3.JPG" alt="سفرة">
            </a>
            <h1>إنشاء حساب</h1>
            <p class="auth-sub">انضم إلى سفرة واستكشف العالم </p>

            <form class="auth-form" id="signupForm">
                <div class="input-group">
                    <label>اسم المستخدم (4 خانات على الأقل)</label>
                    <input type="text" id="username" placeholder="اسم الحساب" required>
                </div>
                <div class="input-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="email" placeholder="example@email.com" required>
                </div>
                <div class="input-group">
                    <label>رقم الجوال (اختياري)</label>
                    <input type="tel" id="phone" placeholder="05xxxxxxxx">
                </div>
                <div class="input-group">
                    <label>كلمة المرور (تبدأ بحرف كبير ورقم)</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <div class="input-group">
                    <label>تأكيد كلمة المرور</label>
                    <input type="password" id="confirmPassword" placeholder="••••••••" required>
                </div>
                <button type="button" id="signupBtn" class="auth-btn">إنشاء الحساب</button>
            </form>

            <p class="auth-switch">عندك حساب؟ <a href="/auth/login.html">تسجيل الدخول</a></p>
        </div>
    </div>
    <div id="loadingScreen"
        style="display:none; position:fixed; inset:0; background:rgba(20,8,2,0.95); z-index:99999; flex-direction:column; align-items:center; justify-content:center; gap:20px;">
        <img src="/img/logo3.JPG" alt="سفرة" style="width:80px; border-radius:50%; animation: pulse 1.5s infinite;">
        <p style="color:#F28500; font-family:'Noto Sans Arabic',sans-serif; font-size:16px; font-weight:600;">جاري إنشاء
            الحساب...</p>
        <style>
            @keyframes pulse {

                0%,
                100% {
                    transform: scale(1);
                    opacity: 1;
                }

                50% {
                    transform: scale(1.08);
                    opacity: 0.7;
                }
            }
        </style>
    </div>
    <script src="/auth/auth.js"></script>
</body>

</html>
