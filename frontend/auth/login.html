<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سفرة - تسجيل الدخول</title>
    <link rel="stylesheet" href="/auth/auth.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@500;600&display=swap');
    </style>

</head>

<body>
    <div class="auth-page">
        <div class="auth-card">
            <a href="/index/index.html" class="auth-logo">
                <a href="/index/index.html"><img src="/img/logo3.JPG" alt="سفرة"></a>
            </a>
            <h1>تسجيل الدخول</h1>
            <p class="auth-sub">أهلاً بك مجدداً في سفرة </p>

            <form class="auth-form" id="loginForm">
                <div class="input-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="loginEmail" placeholder="example@email.com" required>
                </div>
                <div class="input-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" required>
                </div>
                <button type="button" id="loginBtn" class="auth-btn">دخول</button>
            </form>

            <p class="auth-switch">ما عندك حساب؟ <a href="/auth/signup.html">إنشاء حساب</a></p>
        </div>
    </div>
    <div id="loadingScreen"
        style="display:none; position:fixed; inset:0; background:rgba(20,8,2,0.95); z-index:99999; flex-direction:column; align-items:center; justify-content:center; gap:20px;">
        <img src="/img/logo3.JPG" alt="سفرة" style="width:80px; border-radius:50%; animation: pulse 1.5s infinite;">
        <p style="color:#D2A673; font-family:'Noto Sans Arabic',sans-serif; font-size:16px; font-weight:600;">جاري تسجيل
            الدخول...</p>
    </div>
    <script src="/auth/auth.js"></script>
</body>

</html>
