<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سفرة - تسجيل الدخول</title>
    <link rel="stylesheet" href="/frontend/auth/auth.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@500;600&display=swap');
    </style>
    
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <a href="/frontend/index/index.html" class="auth-logo">
                <img src="/frontend/img/logo3.JPG" alt="سفرة">
            </a>
            <h1>تسجيل الدخول</h1>
            <p class="auth-sub">أهلاً بك مجدداً في سفرة </p>

            <form class="auth-form" id="loginForm">
                <div class="input-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="loginEmail" placeholder="example@email.com" required>
                </div>
                <div class="input-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" required>
                </div>
                <button type="button" id="loginBtn" class="auth-btn">دخول</button>
            </form>

            <p class="auth-switch">ما عندك حساب؟ <a href="/frontend/auth/signup.html">إنشاء حساب</a></p>
        </div>
    </div>
    <script src="/frontend/auth/auth.js"></script>
</body>
</html>
