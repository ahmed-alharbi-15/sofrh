<!DOCTYPE html>
<html lang="ar" dir="rtl" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>رمز التحقق - سُفرة</title>
  <!--[if mso]>
  <style type="text/css">
    table, td, p, h1, span { font-family: Tahoma, Arial, sans-serif !important; }
  </style>
  <![endif]-->
  <style type="text/css">
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');
    
    body, table, td, a {
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
    }
    table, td {
      mso-table-lspace: 0pt;
      mso-table-rspace: 0pt;
    }
    img {
      -ms-interpolation-mode: bicubic;
      border: 0;
      outline: none;
      text-decoration: none;
    }
    table {
      border-collapse: collapse !important;
    }
    body {
      height: 100% !important;
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      background-color: #ffffff;
      font-family: 'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    @media screen and (max-width: 600px) {
      .email-container {
        width: 100% !important;
        padding-left: 10px !important;
        padding-right: 10px !important;
      }
      .card-body {
        padding: 25px 15px !important;
      }
      .logo-img {
        width: 120px !important;
      }
      .code-box {
        font-size: 24px !important;
        letter-spacing: 5px !important;
        padding: 10px 18px !important;
      }
    }
  </style>
</head>
<body style="margin: 0; padding: 0; background-color: #ffffff; width: 100% !important; -webkit-font-smoothing: antialiased;">

  <!-- Outer Background Container -->
  <table border="0" cellpadding="0" cellspacing="0" width="100%" role="presentation" style="background-color: #ffffff; table-layout: fixed;">
    <tr>
      <td align="center" style="padding: 30px 0;">
        
        <!-- Email Main Container -->
        <table border="0" cellpadding="0" cellspacing="0" width="100%" class="email-container" role="presentation" style="max-width: 520px; margin: 0 auto;">
          <tr>
            <td align="center" style="padding: 0 10px;">
              
              <!-- Card Wrapper -->
              <table border="0" cellpadding="0" cellspacing="0" width="100%" role="presentation" style="background-color: #4B1D68; border-radius: 20px; box-shadow: 0 10px 30px rgba(75, 29, 104, 0.15); overflow: hidden;">
                
                <!-- Card Header & Content -->
                <tr>
                  <td class="card-body" align="center" style="padding: 35px 25px; direction: rtl; text-align: center;">
                    
                    <!-- Logo Section (مساحة أكبر ومستقلة للشعار) -->
                    <table border="0" cellpadding="0" cellspacing="0" width="100%" role="presentation">
                      <tr>
                        <td align="center" style="padding-bottom: 25px;">
                          <!-- استبدل رابط src أدناه برابط الصورة المباشر من Postimages -->
                          <img class="logo-img" src="https://i.imgur.com/y3J5dyA.png" alt="سُفرة" width="140" style="display: block; width: 140px; max-width: 100%; height: auto; min-height: 40px; margin: 0 auto; border: 0;">
                        </td>
                      </tr>
                    </table>

                    <!-- Welcome Title (تم تصغير الخط قليلاً لتنفس التصميم) -->
                    <h1 style="margin: 0 0 8px 0; color: #ffffff; font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif; font-size: 21px; font-weight: 700; line-height: 1.4;">
                      مرحبًا بك في سُفرة 👋
                    </h1>

                    <!-- Welcome Subtitle -->
                    <p style="margin: 0 0 12px 0; color: #e8dbe8; font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif; font-size: 14px; font-weight: 400; line-height: 1.5;">
                      يسعدنا انضمامك إلينا.
                    </p>

                    <!-- Instruction Text -->
                    <p style="margin: 0 0 20px 0; color: #ffffff; font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif; font-size: 15px; font-weight: 600; line-height: 1.5;">
                      رمز التحقق الخاص بك هو:
                    </p>

                    <!-- Verification Code Box -->
                    <table border="0" cellpadding="0" cellspacing="0" role="presentation" style="margin: 0 auto 20px auto;">
                      <tr>
                        <td align="center" class="code-box" style="background-color: #F28C28; border-radius: 12px; padding: 12px 28px; color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, sans-serif; font-size: 28px; font-weight: 800; letter-spacing: 6px; text-align: center; box-shadow: 0 4px 15px rgba(242, 140, 40, 0.3);">
                          849201
                        </td>
                      </tr>
                    </table>

                    <!-- Expiration Notice -->
                    <p style="margin: 0 0 25px 0; color: #f2e6f5; font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif; font-size: 13px; font-weight: 400; line-height: 1.5;">
                      هذا الرمز صالح لمدة 10 دقائق.
                    </p>

                    <!-- Divider -->
                    <table border="0" cellpadding="0" cellspacing="0" width="100%" role="presentation" style="margin: 0 0 20px 0;">
                      <tr>
                        <td style="border-top: 1px solid rgba(255, 255, 255, 0.15); font-size: 0; line-height: 0;">&nbsp;</td>
                      </tr>
                    </table>

                    <!-- Disclaimer -->
                    <p style="margin: 0 0 15px 0; color: #c4b0cc; font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif; font-size: 12px; font-weight: 400; line-height: 1.5;">
                      إذا لم تقم بإنشاء هذا الحساب، يمكنك تجاهل هذه الرسالة.
                    </p>

                    <!-- Team Signature -->
                    <p style="margin: 0; color: #ffffff; font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif; font-size: 14px; font-weight: 700; line-height: 1.5;">
                      فريق سُفرة
                    </p>

                  </td>
                </tr>

              </table>
              <!-- End Card Wrapper -->

            </td>
          </tr>
        </table>
        <!-- End Email Main Container -->

      </td>
    </tr>
  </table>

</body>
</html>
