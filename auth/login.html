<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سفرة - تسجيل الدخول</title>
    <link rel="stylesheet" href="/auth/auth.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@500;600&display=swap');
    </style>
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <a href="/index/index.html" class="auth-logo">
                <img src="/img/new logo sofrh.jpg" alt="سفرة">
            </a>
            <h1>تسجيل الدخول</h1>
            <p class="auth-sub">أهلاً بك مجدداً في سفرة 👋</p>

            <form class="auth-form">
                <div class="input-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" placeholder="example@email.com">
                </div>
                <div class="input-group">
                    <label>كلمة المرور</label>
                    <input type="password" placeholder="••••••••">
                </div>
                <button type="submit" class="auth-btn">دخول</button>
            </form>

            <p class="auth-switch">ما عندك حساب؟ <a href="/auth/signup.html">إنشاء حساب</a></p>
        </div>
    </div>
</body>
</html>
