<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سفرة - إنشاء حساب</title>
    <link rel="stylesheet" href="/auth/auth.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@500;600&display=swap');
    </style>
    <script src="auth.js"></script>
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <a href="/index/index.html" class="auth-logo">
                <img src="/img/logo3.JPG" alt="سفرة">
            </a>
            <h1>إنشاء حساب</h1>
            <p class="auth-sub">انضم إلى سفرة واستكشف العالم </p>

            <form class="auth-form" id="signupForm">
                <div class="input-group">
                    <label>اسم المستخدم (4 خانات على الأقل)</label>
                    <input type="text" id="username" placeholder="اسم الحساب" required>
                </div>
                <div class="input-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="email" placeholder="example@email.com" required>
                </div>
                <div class="input-group">
                    <label>رقم الجوال (اختياري)</label>
                    <input type="tel" id="phone" placeholder="05xxxxxxxx">
                </div>
                <div class="input-group">
                    <label>كلمة المرور (تبدأ بحرف كبير ورقم)</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <div class="input-group">
                    <label>تأكيد كلمة المرور</label>
                    <input type="password" id="confirmPassword" placeholder="••••••••" required>
                </div>
                <button type="submit" class="auth-btn">إنشاء الحساب</button>
            </form>

            <p class="auth-switch">عندك حساب؟ <a href="/auth/login.html">تسجيل الدخول</a></p>
        </div>
    </div>
</body>
</html>
